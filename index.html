<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>avoa | racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app"></div>
  <button id="reset-view-btn" style="display:none">Resetar visão</button>
  <div id="fps">FPS: --</div>
  <canvas id="minimap" width="300" height="195"></canvas>
  <div id="lap-timer">
    <div id="past-laps"></div>
    <div id="active-lap">00:00:000</div>
  </div>
  <div id="wrong-way-msg">SENTIDO ERRADO</div>

  <!-- Tela de início -->
  <div id="screen-start" class="game-screen start-screen">
    <div class="screen-content">
      <h1>AVOA RACING</h1>
      <p class="subtitle">Acelere, freie e mude de direção com as setas do teclado.<br>Use a tecla 1 para alternar a câmera.</p>
      <button id="btn-play" class="btn-outline">JOGAR</button>
      <button id="btn-show-ranking" class="btn-link">RANKING</button>
    </div>
  </div>

  <!-- HUD de volta atual (visível durante corrida) -->
  <div id="hud-lap-counter" class="hidden">
    <span class="hud-label">VOLTA</span>
    <span class="hud-value"><span id="hud-lap-num">1</span>/3</span>
  </div>

  <!-- Tela de fim -->
  <div id="screen-finish" class="game-screen finish-screen hidden">
    <div class="finish-card">
      <h1>Corrida concluída</h1>
      <div class="finish-rows">
        <div id="finish-laps"></div>
        <div class="finish-row finish-row--total">
          <span>Tempo total</span>
          <strong id="finish-total">00:00.00</strong>
        </div>
        <div class="finish-row finish-row--best">
          <span>Melhor volta</span>
          <strong id="finish-best-lap">00:00.00</strong>
        </div>
      </div>
      <div id="finish-name-section" class="finish-name">
        <input type="text" id="player-name" maxlength="12" placeholder="SEU NOME" autocomplete="off">
        <button id="btn-save-score" class="finish-save">SALVAR</button>
      </div>
      <div id="finish-position" class="hidden"></div>
      <button id="btn-back-to-menu" class="finish-back">VOLTAR O MENU</button>
    </div>
  </div>

  <!-- Tela de ranking -->
  <div id="screen-ranking" class="game-screen ranking-screen hidden">
    <div class="ranking-content">
      <h1>Ranking</h1>
      <table id="ranking-table">
        <thead><tr><th>Piloto</th><th>Tempo</th><th>Melhor volta</th></tr></thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <div class="ranking-actions">
        <button id="btn-close-ranking" class="btn-solid">JOGAR</button>
        <button id="btn-share-ranking" class="btn-outline">COMPARTILHAR</button>
      </div>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./main.js"></script>
</body>
</html>
